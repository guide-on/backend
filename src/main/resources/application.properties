# src/main/resources/application.properties
jdbc.driver=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
jdbc.url=${DB_URL}
jdbc.username=${DB_USERNAME}
jdbc.password=${DB_PASSWORD}

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout-ms=3000
spring.redis.ssl=false

jwt.secret-key=${JWT_SECRET}

guideon.security.dev-relaxed=true

# kakao map api
kakao.api.key=${KAKAO_API_KEY}

# coolsms API
coolsms.api-key=${SMS_API_KEY}
coolsms.secret-key=${SMS_SECRET_KEY}
coolsms.fromnumber=${SMS_FROMNUMBER}

# Google SMTP API
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.username=${MAIL_SMTP_USERNAME}
mail.smtp.password=${MAIL_SMTP_PWD}

# ?? ?? ????(JSON ??)
catalog.industry.tags.path=classpath:config/industry-tags.ko.json

# ??????? ?? ?? API
odcloud.baseUrl=https://api.odcloud.kr/api
odcloud.serviceKey.urlEncoded=${ODCLOUD_SERVICE_KEY}